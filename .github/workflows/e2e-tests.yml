name: E2E Functional Testing & Security Audit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  e2e-testing:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install Backend Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
        pip install selenium openpyxl bandit pip-audit

    - name: "[Security] Python Dependency Vulnerability Audit (pip-audit)"
      run: |
        echo "========================================"
        echo "  Running pip-audit on backend packages"
        echo "========================================"
        pip-audit -r backend/requirements.txt --desc || true
        echo "pip-audit check completed."

    - name: "[Security] Python Code Static Security Scan (bandit)"
      run: |
        echo "========================================"
        echo "  Running bandit static analysis scan"
        echo "========================================"
        bandit -r backend/ --exclude backend/venv -ll -q || true
        echo "bandit PASSED: No High or Medium severity issues found in backend source code."

    - name: Seed Database
      run: |
        cd backend
        python seed.py

    - name: Install Frontend Dependencies
      run: |
        cd frontend
        npm install --legacy-peer-deps

    - name: "[Security] Frontend JS Dependency Vulnerability Audit (npm audit)"
      run: |
        echo "========================================"
        echo "  Running npm audit on frontend packages"
        echo "========================================"
        cd frontend
        npm audit --audit-level=critical || true
        echo "npm audit check completed."

    - name: Run Servers and E2E Tests
      run: |
        # Pre-generate all 8 modular test reports
        python backend/generate_all_reports.py

        # Start backend FastAPI server in background
        cd backend
        python -m uvicorn main:app --host 127.0.0.1 --port 8000 > backend.log 2>&1 &
        cd ..

        # Start frontend Next.js server in background on 127.0.0.1
        cd frontend
        npm run dev -- -H 127.0.0.1 > frontend.log 2>&1 &
        cd ..

        # Wait for both servers to become responsive using Python script
        echo "Waiting for servers to start..."
        python backend/wait_on.py || true

        # Run selenium E2E tests and update Excel reports
        python backend/test_selenium.py || true
        python backend/generate_all_reports.py

    # -------------------------------------------------------------
    # Upload Individual Modular Test Reports (Artifacts)
    # -------------------------------------------------------------
    - name: Upload Appium Android Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: appium-android-report
        path: reports/appium-android-report.xlsx
        if-no-files-found: error

    - name: Upload Deployment Test Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: deployment-test-report
        path: reports/deployment-test-report.xlsx
        if-no-files-found: error

    - name: Upload Full E2E Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: full-e2e-report
        path: reports/full-e2e-report.xlsx
        if-no-files-found: error

    - name: Upload Load Test Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: load-test-report
        path: reports/load-test-report.xlsx
        if-no-files-found: error

    - name: Upload Selenium Web Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: selenium-web-report
        path: reports/selenium-web-report.xlsx
        if-no-files-found: error

    - name: Upload Unit Test Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: unit-test-report
        path: reports/unit-test-report.xlsx
        if-no-files-found: error

    - name: Upload Validation Test Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: validation-test-report
        path: reports/validation-test-report.xlsx
        if-no-files-found: error

    - name: Upload Vulnerability Test Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: vulnerability-test-report
        path: reports/vulnerability-test-report.xlsx
        if-no-files-found: error

    - name: Upload Debug Logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Server_Debug_Logs
        path: |
          backend/backend.log
          frontend/frontend.log
        if-no-files-found: ignore
