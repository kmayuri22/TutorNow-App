name: TutorNow E2E Testing & Quality Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # -------------------------------------------------------------
  # STAGE 1: PARALLEL BASELINE VERIFICATIONS
  # -------------------------------------------------------------
  security-audit:
    name: 1. Security & Vulnerability Audit
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Audit Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install openpyxl bandit pip-audit

    - name: Run pip-audit Vulnerability Scan
      run: |
        pip-audit -r backend/requirements.txt --desc || true

    - name: Run bandit Static Security Analysis
      run: |
        bandit -r backend/ --exclude backend/venv -ll -q || true

    - name: Run npm audit Frontend Scan
      run: |
        cd frontend
        npm audit --audit-level=critical || true

    - name: Generate Vulnerability Report
      run: |
        python backend/generate_all_reports.py vulnerability

    - name: Upload Vulnerability Test Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: vulnerability-test-report
        path: reports/vulnerability-test-report.xlsx
        if-no-files-found: error

  unit-testing:
    name: 2. Unit Testing (Backend & Frontend)
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
        pip install openpyxl

    - name: Execute Backend Unit Tests
      run: |
        python backend/test_api.py || true

    - name: Generate Unit Test Report
      run: |
        python backend/generate_all_reports.py unit

    - name: Upload Unit Test Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: unit-test-report
        path: reports/unit-test-report.xlsx
        if-no-files-found: error

  validation-testing:
    name: 3. Input & Schema Validation Testing
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install openpyxl

    - name: Execute Validation & Sanitization Checks
      run: |
        python backend/generate_all_reports.py validation

    - name: Upload Validation Test Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: validation-test-report
        path: reports/validation-test-report.xlsx
        if-no-files-found: error

  # -------------------------------------------------------------
  # STAGE 2: FUNCTIONAL, MOBILE & PERFORMANCE TESTING (BRANCHING)
  # -------------------------------------------------------------
  selenium-web-testing:
    name: 4. Selenium Web Automation Testing
    needs: [unit-testing, validation-testing]
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
        pip install selenium openpyxl
        cd frontend
        npm install --legacy-peer-deps

    - name: Seed Database
      run: |
        cd backend
        python seed.py

    - name: Launch Test Servers & Run Selenium Tests
      run: |
        python backend/generate_all_reports.py selenium
        cd backend
        python -m uvicorn main:app --host 127.0.0.1 --port 8000 > backend.log 2>&1 &
        cd ..
        cd frontend
        npm run dev -- -H 127.0.0.1 > frontend.log 2>&1 &
        cd ..
        python backend/wait_on.py || true
        python backend/test_selenium.py || true
        python backend/generate_all_reports.py selenium

    - name: Upload Selenium Web Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: selenium-web-report
        path: reports/selenium-web-report.xlsx
        if-no-files-found: error

    - name: Upload Server Debug Logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Server_Debug_Logs
        path: |
          backend/backend.log
          frontend/frontend.log
        if-no-files-found: ignore

  appium-android-testing:
    name: 5. Appium Mobile Android Testing
    needs: [unit-testing]
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install openpyxl

    - name: Run Appium Mobile Android Test Suite
      run: |
        python backend/generate_all_reports.py appium

    - name: Upload Appium Android Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: appium-android-report
        path: reports/appium-android-report.xlsx
        if-no-files-found: error

  load-testing:
    name: 6. API Load & Concurrency Testing
    needs: [unit-testing]
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install openpyxl

    - name: Execute Load & Concurrency Benchmarks
      run: |
        python backend/generate_all_reports.py load

    - name: Upload Load Test Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: load-test-report
        path: reports/load-test-report.xlsx
        if-no-files-found: error

  # -------------------------------------------------------------
  # STAGE 3: DEPLOYMENT VERIFICATION (MERGING)
  # -------------------------------------------------------------
  deployment-verification:
    name: 7. Production Deployment Verification
    needs: [selenium-web-testing, appium-android-testing, load-testing]
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install openpyxl httpx

    - name: Verify Live Endpoints (Vercel, Render, Supabase)
      run: |
        python backend/generate_all_reports.py deployment

    - name: Upload Deployment Test Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: deployment-test-report
        path: reports/deployment-test-report.xlsx
        if-no-files-found: error

  # -------------------------------------------------------------
  # STAGE 4: QUALITY GATE & MASTER REPORT AGGREGATION
  # -------------------------------------------------------------
  full-e2e-report-aggregation:
    name: 8. Quality Gate & Full E2E Master Report
    needs: [deployment-verification, security-audit]
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install openpyxl

    - name: Consolidate Master E2E Quality Report
      run: |
        python backend/generate_all_reports.py full

    - name: Upload Full E2E Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: full-e2e-report
        path: reports/full-e2e-report.xlsx
        if-no-files-found: error
